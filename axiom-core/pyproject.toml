[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "axiom-core"
version = "0.1.0"
description = "AXIOM text-only model library by Cool Shot Systems."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
  { name = "Cool Shot Systems" }
]
keywords = ["axiom", "language-model", "text", "ai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
]

dependencies = [
  "pyyaml>=6.0"
]

[project.optional-dependencies]
training = [
  "torch>=2.0",
  "transformers>=4.40",
  "peft>=0.10"
]

[tool.setuptools]
packages = ["axiom", "axiom.config", "axiom.modeling", "axiom.training", "axiom.evaluation", "axiom.prompts", "axiom.utils"]
include-package-data = true

[tool.setuptools.package-data]
axiom = [
  "config/*.yaml",
  "prompts/*.txt"
]
