services:
  - type: web
    name: axiom-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn axiom.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: AXIOM_ENV
        value: production
      - key: AXIOM_API_KEYS
        value: dev-key-axiom
    pythonVersion: 3.11.6
